name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # run (and deploy) by hand from the Actions tab

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04 # ships PostgreSQL 16 binaries, used by the database tests
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:db
      - run: npm run functions:build

  brands:
    # One deploy job per brand below: the list is supabase/projects/*.json.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@v5
      - id: list
        run: |
          echo "list=$(node -p "JSON.stringify(require('fs').readdirSync('supabase/projects').filter(f => f.endsWith('.json')).map(f => f.slice(0, -5)).sort())")" >> "$GITHUB_OUTPUT"

  deploy:
    # Per brand, in order: new migrations (scripts/apply-migrations.ts), the Edge Function, then
    # the project settings (scripts/configure-project.ts: Auth URLs, sign-in email, SMTP once
    # switched on, CORS origins, a new brand's seed, scheduled jobs). Brands run independently:
    # one brand's failure never stops another brand's deploy.
    #
    # Token: SUPABASE_ACCESS_TOKEN_<BRAND> when that secret exists (e.g. SUPABASE_ACCESS_TOKEN_KOALA),
    # otherwise SUPABASE_ACCESS_TOKEN. Supabase dashboard → Account → Access tokens; GitHub repo →
    # Settings → Secrets and variables → Actions. Without a token the brand is skipped.
    # Same for the Resend SMTP password: RESEND_API_KEY_<BRAND>, otherwise RESEND_API_KEY.
    needs: [test, brands]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        brand: ${{ fromJSON(needs.brands.outputs.list) }}
    name: deploy (${{ matrix.brand }})
    env:
      BRAND: ${{ matrix.brand }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets[format('SUPABASE_ACCESS_TOKEN_{0}', matrix.brand)] || secrets.SUPABASE_ACCESS_TOKEN }}
      RESEND_API_KEY: ${{ secrets[format('RESEND_API_KEY_{0}', matrix.brand)] || secrets.RESEND_API_KEY }}
      # Wallet passes (optional): the brand's Pass Type ID certificate and the Google Wallet service account.
      APPLE_PASS_P12: ${{ secrets[format('APPLE_PASS_P12_{0}', matrix.brand)] }}
      APPLE_PASS_P12_PASSWORD: ${{ secrets[format('APPLE_PASS_P12_PASSWORD_{0}', matrix.brand)] }}
      GOOGLE_WALLET_SERVICE_ACCOUNT: ${{ secrets[format('GOOGLE_WALLET_SERVICE_ACCOUNT_{0}', matrix.brand)] || secrets.GOOGLE_WALLET_SERVICE_ACCOUNT }}
    steps:
      - name: Skip when no token is set for this brand
        if: env.SUPABASE_ACCESS_TOKEN == ''
        run: echo "No SUPABASE_ACCESS_TOKEN for $BRAND; skipping its deploy."
      - uses: actions/checkout@v5
        if: env.SUPABASE_ACCESS_TOKEN != ''
      - uses: actions/setup-node@v5
        if: env.SUPABASE_ACCESS_TOKEN != ''
        with:
          node-version: 22
          cache: npm
      - name: Install
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: npm ci
      - name: Apply new migrations
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: npm run migrations:apply -- --project "$BRAND"
      - name: Build Edge Functions
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: npm run functions:build
      - uses: supabase/setup-cli@v1
        if: env.SUPABASE_ACCESS_TOKEN != ''
        with:
          version: latest
      - name: Deploy Edge Functions
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: |
          ref=$(node -p "require('./supabase/projects/' + process.env.BRAND + '.json').projectRef")
          supabase functions deploy api --remote=$ref --use-api --no-verify-jwt --yes
      - name: Apply Supabase settings
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: npm run project:apply -- --project "$BRAND"
