name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # run (and deploy) by hand from the Actions tab

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04 # ships PostgreSQL 16 binaries, used by the database tests
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:db
      - run: npm run functions:build

  migrate:
    # Applies new files in supabase/migrations to every brand's hosted database
    # (scripts/apply-migrations.ts), after every test passed and before the function deploy.
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Skip when the token is not set
        if: env.SUPABASE_ACCESS_TOKEN == ''
        run: echo "SUPABASE_ACCESS_TOKEN is not set; skipping migrations."
      - uses: actions/checkout@v5
        if: env.SUPABASE_ACCESS_TOKEN != ''
      - uses: actions/setup-node@v5
        if: env.SUPABASE_ACCESS_TOKEN != ''
        with:
          node-version: 22
          cache: npm
      - name: Apply new migrations
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: npm ci && npm run migrations:apply

  deploy-functions:
    # Runs only on main and only once the SUPABASE_ACCESS_TOKEN secret exists
    # (Supabase dashboard → Account → Access tokens; GitHub repo → Settings →
    # Secrets and variables → Actions). Migrations are applied separately.
    needs: [test, migrate]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Skip when the deploy token is not set
        if: env.SUPABASE_ACCESS_TOKEN == ''
        run: echo "SUPABASE_ACCESS_TOKEN is not set; skipping the deploy."
      - uses: actions/checkout@v5
        if: env.SUPABASE_ACCESS_TOKEN != ''
      - uses: actions/setup-node@v5
        if: env.SUPABASE_ACCESS_TOKEN != ''
        with:
          node-version: 22
          cache: npm
      - if: env.SUPABASE_ACCESS_TOKEN != ''
        run: npm ci && npm run functions:build
      - uses: supabase/setup-cli@v1
        if: env.SUPABASE_ACCESS_TOKEN != ''
        with:
          version: latest
      - name: Deploy Edge Functions (every brand's project, supabase/projects/*.json)
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: |
          for f in supabase/projects/*.json; do
            ref=$(node -p "require('./$f').projectRef")
            echo "== $f ($ref)"
            supabase functions deploy api --remote=$ref --use-api --no-verify-jwt --yes
          done

  configure-project:
    # Applies supabase/projects/<brand>.json to each brand's project with the Management API:
    # Auth URLs, the sign-in code email, SMTP via Resend (once switched on), the API's CORS
    # origins, the scheduled jobs, and a new brand's seed (only when its brand row is missing).
    needs: [test, migrate]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
    steps:
      - name: Skip when the token is not set
        if: env.SUPABASE_ACCESS_TOKEN == ''
        run: echo "SUPABASE_ACCESS_TOKEN is not set; skipping."
      - uses: actions/checkout@v5
        if: env.SUPABASE_ACCESS_TOKEN != ''
      - uses: actions/setup-node@v5
        if: env.SUPABASE_ACCESS_TOKEN != ''
        with:
          node-version: 22
          cache: npm
      - name: Apply Supabase settings
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: npm ci && npm run project:apply
